# Builds the signed release bundle after every change on main and sends it to the closed testing
# track on Google Play. How it works and the one-time setup: docs/PLAY-AUTO-UPLOAD.md
name: Play closed testing

on:
  push:
    branches: [main]
    # Docs, the website and device tests change nothing in the app: no new upload (and no restarted review).
    paths-ignore: ['docs/**', '**/*.md', 'utils/**', 'e2e/**']
  # A change to this file is checked in its pull request: build and checks only, never an upload.
  pull_request:
    paths: ['.github/workflows/play-internal.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to Google Play (off: build and check only)'
        type: boolean
        default: true

# Uploads run one after the other, never in parallel.
concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Before any secret is on disk or in the environment: this step runs third-party build scripts (FFmpeg,
      # Media3, pinned to commit SHAs in utils/ffmpeg-audio/build.sh). Later Gradle calls skip it with -x.
      - name: Build FFmpeg decoders
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;30.0.16248370' > /dev/null
          ./gradlew :ffmpeg:buildFfmpegAudio
          ls -l ffmpeg/build/ffmpeg-audio/{arm64-v8a,armeabi-v7a,x86_64}/libffmpegJNI.so
      - name: Build DeepFilterNet library
        run: |
          ./gradlew :app:buildDeepFilter
          ls -l app/build/deepfilter/{arm64-v8a,x86_64}/libordo_df.so

      - name: Version and signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ORDO_UPLOAD_KEYSTORE_BASE64 }}
          HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          WANTS_UPLOAD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.upload == true) }}
        run: |
          # Play only accepts a versionCode once; run_number grows with every run of this workflow.
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(sed -n "s/^ *versionName '\(.*\)'$/\1/p" app/build.gradle)" >> "$GITHUB_ENV"
          ks=$RUNNER_TEMP/upload.jks
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > "$ks"
            real_key=true
          else
            # No secrets (fork, or setup not done yet): throwaway key, so the bundle builds but is never uploaded.
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass dryrun-only -alias dryrun \
              -keyalg RSA -keysize 2048 -validity 1 -dname CN=dryrun
            real_key=false
          fi
          upload=false
          if [ "$WANTS_UPLOAD" = true ]; then
            if [ "$real_key" = true ] && [ "$HAS_PLAY_ACCOUNT" = true ]; then
              upload=true
            else
              echo "::warning::Upload skipped: GitHub secrets for Google Play are missing (docs/PLAY-AUTO-UPLOAD.md)."
            fi
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest -x :ffmpeg:buildFfmpegAudio -x :app:buildDeepFilter

      - name: Build signed bundle
        env:
          STORE_FILE: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.ORDO_STORE_PASSWORD || 'dryrun-only' }}
          KEY_ALIAS: ${{ secrets.ORDO_KEY_ALIAS || 'dryrun' }}
          KEY_PASSWORD: ${{ secrets.ORDO_KEY_PASSWORD || 'dryrun-only' }}
        run: ./gradlew --no-configuration-cache :app:bundleRelease -PversionCodeOverride="$VERSION_CODE" -x :ffmpeg:buildFfmpegAudio -x :app:buildDeepFilter

      - name: Check 16 KB page alignment
        run: utils/check-16k.sh app/build/outputs/bundle/release/app-release.aab

      - name: Release notes
        if: steps.key.outputs.upload == 'true'
        run: |
          # changelogs/<versionCode>.txt, else changelogs/default.txt, else a generic line.
          mkdir -p "$RUNNER_TEMP/whatsnew"
          for lang in de-DE en-US; do
            dir=fastlane/metadata/android/$lang/changelogs
            out=$RUNNER_TEMP/whatsnew/whatsnew-$lang
            if [ -f "$dir/$VERSION_CODE.txt" ]; then cp "$dir/$VERSION_CODE.txt" "$out"
            elif [ -f "$dir/default.txt" ]; then cp "$dir/default.txt" "$out"
            elif [ "$lang" = de-DE ]; then echo "Neue Testversion $VERSION_NAME ($VERSION_CODE)." > "$out"
            else echo "New test build $VERSION_NAME ($VERSION_CODE)." > "$out"
            fi
          done
          head -v "$RUNNER_TEMP"/whatsnew/*

      - name: Upload to Google Play
        if: steps.key.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.beko2210.ordo
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
          # Repository variables, see docs/PLAY-AUTO-UPLOAD.md. 'alpha' is Play's default closed test.
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
