name: Android CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    # Third-party build scripts (FFmpeg, Media3, pinned in utils/ffmpeg-audio/build.sh) in their own step.
    - name: Build FFmpeg decoders
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;30.0.16248370' > /dev/null
        ./gradlew :ffmpeg:buildFfmpegAudio
        ls -l ffmpeg/build/ffmpeg-audio/{arm64-v8a,armeabi-v7a,x86_64}/libffmpegJNI.so
    - name: Build with Gradle
      run: ./gradlew assembleDebug testDebugUnitTest lintVitalRelease -x :ffmpeg:buildFfmpegAudio
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 10
