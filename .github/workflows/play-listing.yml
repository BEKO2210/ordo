# Sends the store listing texts in fastlane/metadata/android/<lang>/ to Google Play. Manual only,
# never on push. Images and screenshots are not in the repo yet, so they are left untouched on Play.
name: Play store listing

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Only validate with Google Play, change nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.4'

      - name: Install fastlane
        run: gem install fastlane -v 2.241.2 --no-document

      - name: Upload listing texts
        env:
          SUPPLY_PACKAGE_NAME: com.beko2210.ordo
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SUPPLY_METADATA_PATH: fastlane/metadata/android
          SUPPLY_VALIDATE_ONLY: ${{ inputs.validate_only }}
          SUPPLY_SKIP_UPLOAD_APK: 'true'
          SUPPLY_SKIP_UPLOAD_AAB: 'true'
          SUPPLY_SKIP_UPLOAD_CHANGELOGS: 'true'
          SUPPLY_SKIP_UPLOAD_IMAGES: 'true'
          SUPPLY_SKIP_UPLOAD_SCREENSHOTS: 'true'
        run: fastlane supply
