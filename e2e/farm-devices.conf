# Test devices of the farm (farm.sh): a name the lock command knows (pop-os: ~/ordo-geraet.sh <name>), then what the
# device can do. A suite asks for capabilities with "# farm: needs=..." in its own file.
#   shots   its screen can be compared by colour (no blue-light tint, fast enough for screen recordings)
#   hdr     HDR display and enough GPU for "Detail plus" (measured passes)
#   slow    low-end: every time limit is doubled
#   tablet / phone   for suites that only make sense on one of them
tab   tablet shots hdr
a8    tablet slow
w90   tablet shots
s21   phone shots
