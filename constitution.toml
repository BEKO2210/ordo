# Laws of Ordo's living roadmap (autopoiesis, https://github.com/BEKO2210/autopoiesis). `utils/roadmap.sh` runs it.
# The kernel never writes this file; after a change run `apo ratify`.
goal = "Ordo: der beste und sicherste Dateimanager mit KI auf dem Gerät – bis 1.0.0 im Play Store und danach Version für Version weiter."

[budget]
initial_energy = 100
mutation_cost = 5
mitosis_cost = 10
reward_per_done = 20
reward_per_fitness = 30

[limits]
max_cells = 64
max_depth = 3
max_children = 3
fail_streak_for_mitosis = 2
mutation_cooldown_ticks = 3
rollback_window = 3
fusion_after = 3
# Long-term goals must not die of old age.
idle_ttl_days = 0

[trust]
auto_approve_llm_commands = false
command_timeout_s = 120
