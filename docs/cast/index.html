<!-- Ordo's Cast receiver (Custom Web Receiver, CAF). Runs on the TV; ?preview shows it in a desktop browser. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ordo</title>
<style>
@font-face {
  font-family: "Geologica";
  src: url("../fonts/geologica-latin.woff2") format("woff2");
  font-weight: 100 900;
  font-display: block;
}
:root {
  --tint: 37 99 235;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #0b1120; color: #f1f5f9;
  font-family: "Geologica", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* The cover, drawn into 32 px and stretched: the browser's smoothing does the blur, no filter on the TV's GPU. */
#wash {
  position: fixed; inset: -5%; width: 110%; height: 110%;
  opacity: 0; transition: opacity 600ms var(--ease);
}
#wash.on { opacity: .9; }
#glow {
  position: fixed; inset: 0;
  background:
    radial-gradient(120vh 90vh at 15% 20%, rgb(var(--tint) / .45), transparent 70%),
    linear-gradient(180deg, rgb(11 17 32 / .25), rgb(11 17 32 / .82));
  transition: background 600ms var(--ease);
  animation: drift 24s ease-in-out infinite alternate;
}
@keyframes drift { from { transform: translate3d(-2%, -1%, 0); } to { transform: translate3d(2%, 1%, 0); } }
/* TV safe area: 5 % on every side. */
main {
  position: fixed; inset: 5vh 5vw;
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6vw;
}
#cover {
  width: 56vh; height: 56vh; border-radius: 3vh; object-fit: cover;
  background: rgb(255 255 255 / .08);
  box-shadow: 0 4vh 9vh rgb(0 0 0 / .45), 0 1vh 2.5vh rgb(0 0 0 / .3);
}
#placeholder {
  width: 56vh; height: 56vh; border-radius: 3vh; display: grid; place-items: center;
  background: linear-gradient(135deg, rgb(var(--tint) / .55), rgb(var(--tint) / .2));
  box-shadow: 0 4vh 9vh rgb(0 0 0 / .45);
}
#placeholder svg { width: 22vh; height: 22vh; fill: rgb(255 255 255 / .85); }
.text { min-width: 0; }
h1, p {
  /* Never break inside a word; long lines end with an ellipsis instead. */
  overflow-wrap: normal; word-break: normal; hyphens: manual;
  display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance;
}
h1 { font-size: 7vh; line-height: 1.12; font-weight: 600; letter-spacing: -.01em; -webkit-line-clamp: 2; }
#artist { margin-top: 2.2vh; font-size: 4vh; line-height: 1.2; color: rgb(241 245 249 / .86); -webkit-line-clamp: 1; }
#album { margin-top: 1vh; font-size: 3vh; line-height: 1.2; color: rgb(241 245 249 / .62); -webkit-line-clamp: 1; }
.progress { margin-top: 6vh; max-width: 70vh; }
.track { height: .7vh; border-radius: .35vh; background: rgb(255 255 255 / .2); overflow: hidden; }
#bar { height: 100%; width: 100%; background: #fff; transform-origin: left; transform: scaleX(0); border-radius: .35vh; }
.times { margin-top: 1.4vh; display: flex; justify-content: space-between; font-size: 2.4vh; color: rgb(241 245 249 / .7);
  font-variant-numeric: tabular-nums; }
#state { margin-left: 1.2vh; }
.brand {
  position: fixed; top: 5vh; right: 5vw; display: flex; align-items: center; gap: 1.2vh;
  font-size: 2.6vh; font-weight: 600; color: rgb(241 245 249 / .85);
}
.brand img { width: 4vh; height: 4vh; border-radius: 1vh; }
/* Track change: the old song fades and settles, the new one rises in 300 ms. */
.swap main { opacity: 0; transform: translate3d(0, 1.5vh, 0); }
main { transition: opacity 300ms var(--ease), transform 300ms var(--ease); }
#idle {
  position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 3vh;
  transition: opacity 400ms var(--ease);
}
#idle img { width: 18vh; height: 18vh; border-radius: 4.5vh; box-shadow: 0 3vh 7vh rgb(0 0 0 / .45); }
#idle span { font-size: 5vh; font-weight: 600; }
#idle small { font-size: 2.6vh; color: rgb(241 245 249 / .65); }
body.playing #idle, body:not(.playing) main, body:not(.playing) .brand { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  #glow { animation: none; }
  main, #wash, #idle { transition: none; }
}
</style>
</head>
<body>
<canvas id="wash" width="32" height="32"></canvas>
<div id="glow"></div>
<div id="idle">
  <img src="../icon/play-store-icon.png" alt="">
  <span>Ordo</span>
  <small id="ready">Bereit</small>
</div>
<div class="brand"><img src="../icon/play-store-icon.png" alt="">Ordo</div>
<main>
  <div id="art">
    <div id="placeholder"><svg viewBox="0 -960 960 960" aria-hidden="true"><path fill="#ffffff" fill-opacity=".85" d="M400-120q-66 0-113-47t-47-113q0-66 47-113t113-47q23 0 42.5 5.5T480-418v-382q0-17 11.5-28.5T520-840h160q17 0 28.5 11.5T720-800v80q0 17-11.5 28.5T680-680H560v400q0 66-47 113t-113 47Z"/></svg></div>
  </div>
  <div class="text">
    <h1 id="title"></h1>
    <p id="artist"></p>
    <p id="album"></p>
    <div class="progress">
      <div class="track"><div id="bar"></div></div>
      <div class="times"><span id="elapsed">0:00</span><span><span id="total">0:00</span><span id="state"></span></span></div>
    </div>
  </div>
</main>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const preview = new URLSearchParams(location.search).has("preview");
if (!navigator.language.startsWith("de")) {
  document.documentElement.lang = "en";
  $("ready").textContent = "Ready to play";
}
let currentKey = null;
let duration = 0;
let position = 0;
let playing = false;
let positionAt = performance.now();

function format(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const s = Math.floor(seconds), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(r).padStart(2, "0");
}

/** Average colour of the cover for the glow, and the cover itself in 32 px for the wash. */
function washFrom(image) {
  const canvas = $("wash"), context = canvas.getContext("2d");
  try {
    context.drawImage(image, 0, 0, 32, 32);
    const pixels = context.getImageData(0, 0, 32, 32).data;
    let r = 0, g = 0, b = 0;
    for (let i = 0; i < pixels.length; i += 4) { r += pixels[i]; g += pixels[i + 1]; b += pixels[i + 2]; }
    const n = pixels.length / 4;
    document.documentElement.style.setProperty("--tint", `${r / n | 0} ${g / n | 0} ${b / n | 0}`);
    canvas.classList.add("on");
  } catch (e) {
    canvas.classList.remove("on");
  }
}

function showTrack(meta) {
  const key = [meta.title, meta.artist, meta.albumName, meta.image].join("|");
  if (key === currentKey) return;
  const first = currentKey === null;
  currentKey = key;
  const apply = () => {
    $("title").textContent = meta.title || "";
    $("artist").textContent = meta.artist || meta.albumArtist || "";
    $("album").textContent = meta.albumName || "";
    const art = $("art");
    art.replaceChildren();
    if (meta.image) {
      const image = new Image();
      image.crossOrigin = "anonymous";
      image.id = "cover";
      image.alt = "";
      image.onload = () => washFrom(image);
      image.onerror = () => { art.replaceChildren(placeholder); $("wash").classList.remove("on"); };
      image.src = meta.image;
      art.append(image);
    } else {
      art.append(placeholder);
      $("wash").classList.remove("on");
      document.documentElement.style.setProperty("--tint", "37 99 235");
    }
    document.body.classList.remove("swap");
  };
  if (first) { apply(); return; }
  document.body.classList.add("swap");
  setTimeout(apply, 300);
}
const placeholder = $("placeholder");

function setState(isPlaying, active) {
  playing = isPlaying;
  document.body.classList.toggle("playing", active);
  $("state").textContent = active && !isPlaying ? "  ❚❚" : "";
}

function tick() {
  const now = performance.now();
  const shown = playing ? position + (now - positionAt) / 1000 : position;
  const clamped = duration > 0 ? Math.min(shown, duration) : shown;
  $("bar").style.transform = `scaleX(${duration > 0 ? clamped / duration : 0})`;
  $("elapsed").textContent = format(clamped);
  $("total").textContent = format(duration);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

if (preview) {
  // Desktop preview: a made-up song and a cover painted on a canvas.
  const art = document.createElement("canvas");
  art.width = art.height = 600;
  const c = art.getContext("2d");
  const gradient = c.createLinearGradient(0, 0, 600, 600);
  gradient.addColorStop(0, "#f59e0b"); gradient.addColorStop(.55, "#db2777"); gradient.addColorStop(1, "#4c1d95");
  c.fillStyle = gradient; c.fillRect(0, 0, 600, 600);
  c.fillStyle = "rgba(255,255,255,.9)"; c.beginPath(); c.arc(300, 330, 120, 0, Math.PI * 2); c.fill();
  c.fillStyle = "rgba(76,29,149,.85)"; c.fillRect(0, 380, 600, 220);
  const params = new URLSearchParams(location.search);
  if (params.get("preview") !== "idle") {
    showTrack({
      title: params.get("title") || "Abendlicht über der Stadt",
      artist: "Ordo Testband", albumName: "Wohnzimmer Sessions",
      image: params.get("preview") === "nocover" ? null : art.toDataURL("image/jpeg", .9)
    });
    duration = 214; position = 63; positionAt = performance.now();
    setState(params.get("preview") !== "paused", true);
  }
} else if (window.cast && cast.framework) {
  const context = cast.framework.CastReceiverContext.getInstance();
  const player = context.getPlayerManager();
  const audio = document.createElement("audio");
  document.body.append(audio);
  player.setMediaElement(audio);
  const Event = cast.framework.events.EventType;
  const sync = () => {
    const media = player.getMediaInformation();
    const state = player.getPlayerState();
    const active = !!media && state !== cast.framework.messages.PlayerState.IDLE;
    if (media) {
      const m = media.metadata || {};
      showTrack({
        title: m.title, artist: m.artist, albumArtist: m.albumArtist, albumName: m.albumName,
        image: m.images && m.images.length ? m.images[0].url : null
      });
      duration = player.getDurationSec() || media.duration || 0;
    }
    position = player.getCurrentTimeSec() || 0;
    positionAt = performance.now();
    setState(state === cast.framework.messages.PlayerState.PLAYING, active);
  };
  [Event.PLAYER_LOAD_COMPLETE, Event.PLAYING, Event.PAUSE, Event.SEEKED, Event.ENDED, Event.MEDIA_FINISHED,
   Event.TIME_UPDATE, Event.BUFFERING, Event.ERROR].forEach((type) => player.addEventListener(type, sync));
  const options = new cast.framework.CastReceiverOptions();
  options.statusText = "Ordo";
  // No video: the TV only needs to keep the screen for this page.
  options.disableIdleTimeout = false;
  context.start(options);
}
</script>
</body>
</html>
